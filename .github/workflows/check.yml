name: Check

on:
  push:
  pull_request:

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-migrations.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  data-layer:
    name: Data layer against a real database
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Test-only values for a throwaway database; not secrets.
      QIPU_JWT_SECRET: qipu-ci-test-secret-not-used-anywhere-else-0123456789
      QIPU_PGRST_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply all migrations
        run: scripts/test-migrations.sh
      - name: Prepare the API role and two test users
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role authenticator login password 'authenticator' noinherit;
          grant anon, authenticated to authenticator;
          insert into auth.users (id, email) values
            ('00000000-0000-0000-0000-00000000c0a1', 'user-a@example.com'),
            ('00000000-0000-0000-0000-00000000c0b2', 'user-b@example.com');
          SQL
      - name: Start PostgREST (what Supabase uses to answer the app)
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:authenticator@localhost:5432/postgres \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$QIPU_JWT_SECRET" -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do curl -sf "$QIPU_PGRST_URL/" > /dev/null && exit 0; sleep 1; done
          docker logs postgrest; exit 1
      - name: Run the data layer tests
        run: npx vitest run src/data/supabase.integration.test.ts
      - name: PostgREST log (if something failed)
        if: failure()
        run: docker logs postgrest || true
