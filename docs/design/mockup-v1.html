<title>Qipu Workspace Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane research workspace (sidebar · content · context panel); the reader drops the sidebar to give the page room. */
:root {
  /* Qipu tokens (src/lib/tokens.ts) */
  --paper: #faf8f4; --cream: #f0ebdd; --sand: #e8e2d5; --dust: #d8cfba;
  --stone: #a89b85; --sage: #7a7060; --ink: #1a1a1a;
  --accent: #4a5b78; --accent2: #6b7d99; --soft: #e6ebf3; --softer: #eef2f8;
  /* proposed additions: reading highlights */
  --quote-hl: #dfe6f1; --note-hl: #f1e6c8; --note-mark: #a8803a;
  --page: #ffffff; --shadow: rgba(60, 50, 30, .08);
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Lora', Georgia, 'Times New Roman', serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #191816; --cream: #222019; --sand: #2a2823; --dust: #3a372f;
  --stone: #8e8371; --sage: #b2a78f; --ink: #ece6da;
  --accent: #9fb1d0; --accent2: #8194b4; --soft: #263044; --softer: #1f2533;
  --quote-hl: #2c3850; --note-hl: #43391f; --note-mark: #d4ae62;
  --page: #211f1b; --shadow: rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #191816; --cream: #222019; --sand: #2a2823; --dust: #3a372f;
  --stone: #8e8371; --sage: #b2a78f; --ink: #ece6da;
  --accent: #9fb1d0; --accent2: #8194b4; --soft: #263044; --softer: #1f2533;
  --quote-hl: #2c3850; --note-hl: #43391f; --note-mark: #d4ae62;
  --page: #211f1b; --shadow: rgba(0,0,0,.35); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.55; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--soft); }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--sage); }

/* Mockup strip */
.strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; height: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--dust); background: var(--cream); }
.strip .label { color: var(--sage); }
.strip nav { display: flex; gap: 4px; }
.strip nav button { padding: 3px 10px; border-radius: 999px; font-size: 12.5px; color: var(--sage); }
.strip nav button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.strip .hint { margin-left: auto; font-size: 12px; color: var(--sage); font-style: italic; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: calc(100% - 40px); }
.app[data-view="reader"] { grid-template-columns: minmax(0, 1fr); }
.app[data-view="reader"] .side { display: none; }

/* Sidebar */
.side { border-right: 1px solid var(--dust); background: var(--cream); overflow-y: auto; padding: 18px 12px 24px; display: flex; flex-direction: column; gap: 20px; }
.brand { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; padding: 0 8px; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--mono); font-size: 10px; color: var(--stone); font-weight: 400; letter-spacing: .05em; }
.side section { display: flex; flex-direction: column; gap: 1px; }
.side .label { padding: 0 8px 6px; display: flex; justify-content: space-between; }
.side .label button { color: var(--stone); font-size: 13px; line-height: 1; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 4px 8px; border-radius: 5px; font-size: 13.5px; color: var(--ink); }
.nav:hover { background: var(--sand); }
.nav[aria-current="true"] { background: var(--soft); color: var(--accent); }
.nav .count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--stone); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.nav.child { padding-left: 24px; }
.nav.grandchild { padding-left: 40px; }
.nav .caret { width: 10px; color: var(--stone); font-size: 9px; flex: none; }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--dust); padding-top: 12px; }

/* Shared topbar */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 14px; padding-inline: 24px; border-bottom: 1px solid var(--dust); }
.top h1 { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -.01em; margin: 0; }
.top .sub { color: var(--sage); font-size: 13px; }
.btn.menu-btn { display: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--dust); background: var(--page); font-size: 13px; }
.btn:hover { border-color: var(--stone); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn.ghost { border-color: transparent; background: none; color: var(--sage); }
.btn.ghost:hover { color: var(--ink); background: var(--sand); }

/* Library */
.lib { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100%; min-height: 0; }
.lib-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.searchrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 12px; padding-inline: 24px; border-bottom: 1px solid var(--sand); }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--dust); border-radius: 6px; padding: 5px 10px; background: var(--page); min-width: 0; }
.search input { border: 0; outline: 0; background: none; width: 100%; font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: var(--sand); font-size: 12px; white-space: nowrap; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; }
.chip button { color: var(--stone); font-size: 12px; line-height: 1; }
.list { overflow: auto; flex: 1; }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: var(--paper); text-align: left; font-weight: 400; padding: 8px 10px; border-bottom: 1px solid var(--dust); z-index: 1; }
th:first-child, td:first-child { padding-left: 24px; }
th button { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--sage); }
td { padding: 9px 10px; border-bottom: 1px solid var(--sand); vertical-align: top; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--softer); }
tr.row[aria-selected="true"] td { background: var(--soft); }
.t-title { font-weight: 500; line-height: 1.35; }
.t-creators { color: var(--sage); font-size: 12.5px; }
.type { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--sage); white-space: nowrap; }
.type.note { color: var(--note-mark); }
.yr { font-family: var(--mono); font-size: 12px; color: var(--sage); }
.badges { display: flex; gap: 8px; color: var(--stone); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.tagdots { display: flex; gap: 4px; flex-wrap: wrap; }
.empty { padding: 40px 24px; color: var(--sage); font-style: italic; }

/* Context panel (inspector / reader panel / note links) */
.panel { border-left: 1px solid var(--dust); background: var(--paper); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel h2 { font-family: var(--display); font-size: 19px; font-weight: 500; line-height: 1.25; margin: 4px 0 2px; text-wrap: balance; }
.panel section { display: flex; flex-direction: column; gap: 6px; }
.meta { display: grid; grid-template-columns: 82px 1fr; gap: 4px 10px; font-size: 13px; }
.meta dt { color: var(--sage); font-family: var(--mono); font-size: 11px; padding-top: 2px; }
.meta dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.addchip { border: 1px dashed var(--dust); background: none; color: var(--stone); }
.linkrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; text-align: left; width: 100%; }
.linkrow:hover .lt { color: var(--accent); text-decoration: underline; }
.linkrow .lt { font-size: 13px; }
.muted { color: var(--sage); font-size: 12.5px; }
.anchored { border-left: 2px solid var(--note-mark); padding: 2px 0 2px 10px; text-align: left; width: 100%; }
.anchored .lt { font-size: 13px; font-weight: 500; }
.anchored:hover .lt { color: var(--accent); }

/* Reader */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%; min-height: 0; }
.reader-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.reader .top h1 { font-size: 17px; }
.pagewrap { flex: 1; overflow: auto; background: var(--sand); padding: 28px 20px 60px; }
.page { position: relative; max-width: 640px; margin: 0 auto; background: var(--page); box-shadow: 0 1px 3px var(--shadow), 0 8px 24px var(--shadow); padding: 56px 64px 64px; font-family: 'Times New Roman', Georgia, serif; font-size: 15.5px; line-height: 1.62; }
.page .runhead { display: flex; justify-content: space-between; font-size: 12px; color: var(--sage); letter-spacing: .06em; margin-bottom: 36px; font-variant: small-caps; }
.page h3 { text-align: center; font-weight: 400; font-size: 14px; letter-spacing: .18em; margin: 0 0 4px; }
.page h4 { text-align: center; font-weight: 400; font-size: 17px; letter-spacing: .08em; margin: 0 0 28px; }
.page p { margin: 0 0 14px; text-indent: 1.6em; text-align: justify; hyphens: auto; position: relative; }
.page .bar { height: 10px; background: var(--sand); border-radius: 2px; margin: 0 0 11px; }
mark { color: inherit; border-radius: 2px; padding: 1px 0; cursor: pointer; }
mark.q { background: var(--quote-hl); }
mark.n { background: var(--note-hl); }
mark.flash { outline: 2px solid var(--accent); }
.margin-note { position: absolute; right: -46px; width: 22px; height: 22px; border-radius: 50%; background: var(--note-mark); color: var(--page); font-family: var(--mono); font-size: 11px; display: grid; place-items: center; }
.pop { position: fixed; z-index: 30; display: flex; gap: 2px; padding: 3px; background: var(--ink); border-radius: 8px; box-shadow: 0 6px 18px var(--shadow); }
.pop button { color: var(--paper); padding: 5px 10px; border-radius: 5px; font-size: 12.5px; }
.pop button:hover { background: rgba(127,127,127,.3); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--dust); margin: -20px -20px 0; padding: 0 12px; position: sticky; top: -20px; background: var(--paper); z-index: 2; }
.tabs button { padding: 12px 10px 10px; font-size: 13px; color: var(--sage); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--mono); font-size: 10.5px; color: var(--stone); margin-left: 3px; }
.card { border: 1px solid var(--dust); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--page); }
.card.is-new { border-color: var(--accent2); }
.card blockquote { margin: 0; font-size: 13.5px; line-height: 1.5; padding-left: 10px; border-left: 2px solid var(--accent2); }
.card.notecard blockquote { border-left-color: var(--note-mark); color: var(--sage); font-size: 12.5px; font-style: italic; }
.card .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.loc { width: 90px; border: 1px solid transparent; border-radius: 4px; padding: 1px 5px; background: var(--softer); font-family: var(--mono); font-size: 11px; }
.loc:hover, .loc:focus { border-color: var(--dust); }
.tagin { width: 80px; border: 1px dashed var(--dust); border-radius: 999px; padding: 0 8px; background: none; font-size: 12px; outline: 0; }
.card textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--dust); border-radius: 6px; padding: 8px; background: var(--paper); font-size: 13.5px; line-height: 1.5; }
.card .ntitle { font-weight: 500; font-size: 13.5px; }
.textlink { color: var(--accent); font-size: 12.5px; }
.textlink:hover { text-decoration: underline; }

/* Note editor */
.notev { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100%; min-height: 0; }
.note-main { overflow-y: auto; min-width: 0; }
.note-inner { max-width: 700px; margin: 0 auto; padding: 32px 32px 80px; display: flex; flex-direction: column; gap: 16px; }
.note-title { font-family: var(--display); font-size: 30px; font-weight: 500; letter-spacing: -.015em; border: 0; outline: 0; background: none; width: 100%; padding: 0; }
.anchor-card { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px 14px; border-radius: 8px; background: var(--note-hl); width: 100%; }
.anchor-card .q { font-style: italic; font-size: 13.5px; line-height: 1.5; }
.anchor-card .src { font-size: 12.5px; color: var(--sage); }
.anchor-card:hover .src { color: var(--accent); }
.modebar { display: flex; gap: 2px; align-self: flex-start; background: var(--sand); border-radius: 6px; padding: 2px; }
.modebar button { padding: 2px 10px; border-radius: 4px; font-size: 12px; color: var(--sage); }
.modebar button[aria-pressed="true"] { background: var(--page); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
.editor { width: 100%; min-height: 340px; border: 0; outline: 0; background: none; resize: none; font-size: 15px; line-height: 1.7; font-family: var(--mono); font-size: 13.5px; }
.rendered { font-size: 15.5px; line-height: 1.75; max-width: 65ch; }
.rendered p { margin: 0 0 14px; }
.wikilink { color: var(--accent); border-bottom: 1px solid var(--accent2); cursor: pointer; }
.wikilink.missing { color: var(--stone); border-bottom-style: dashed; }
.hashtag { font-family: var(--mono); font-size: 12px; background: var(--sand); padding: 1px 6px; border-radius: 999px; cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); }
.addmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--page); border: 1px solid var(--dust); border-radius: 8px; box-shadow: 0 8px 24px var(--shadow); padding: 4px; min-width: 210px; display: flex; flex-direction: column; }
.addmenu button { text-align: left; padding: 7px 10px; border-radius: 5px; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
.addmenu button:hover { background: var(--softer); }
.addmenu button span { color: var(--stone); font-family: var(--mono); font-size: 10.5px; }
.rel { position: relative; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app, .app[data-view="reader"] { display: block; height: auto; }
  .side { display: none; position: fixed; z-index: 25; inset: 40px auto 0 0; width: 260px; box-shadow: 0 0 40px var(--shadow); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .app.menu-open .side { display: flex; }
  .btn.menu-btn { display: inline-flex; }
  .lib, .reader, .notev { display: block; height: auto; }
  .panel { border-left: 0; border-top: 1px solid var(--dust); }
  .list { overflow: visible; }
  .top, .searchrow { padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  th:first-child, td:first-child { padding-left: 16px; }
  .hide-sm { display: none; }
  .page { padding: 32px 26px 40px; }
  .margin-note { right: -20px; }
  .pagewrap { padding: 16px 10px 30px; }
  .note-inner { padding: 24px 16px 40px; }
  .strip .hint { display: none; }
  .tabs { position: static; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast, .pop, .addmenu { animation: fadeIn .15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(var(--tx, 0), 4px); } to { opacity: 1; transform: translate(var(--tx, 0), 0); } }
  .toast { --tx: -50%; }
}
</style>

<div class="strip">
  <span class="label">Mockup · example data</span>
  <nav aria-label="Mockup views">
    <button data-go="library">Library</button>
    <button data-go="reader">Reader</button>
    <button data-go="note">Note</button>
  </nav>
  <span class="hint">In the Reader, select any text to quote it or add a note.</span>
</div>
<div class="app" id="app" data-view="library">
  <aside class="side" id="side" aria-label="Sidebar"></aside>
  <main id="main" style="min-height:0;min-width:0;height:100%"></main>
</div>

<script>
// ─── Example data ─────────────────────────────────────────────────────────
const TYPES = {

  fieldnote: ['Fieldnote', 'fieldwork'], interview: ['Interview', 'fieldwork'], document: ['Document', 'fieldwork'],
  note: ['Note', 'notes'],
};
const FAMILIES = [['all', 'All items'], ['bibliography', 'Bibliography'], ['fieldwork', 'Fieldwork'], ['notes', 'Notes']];
const TAGS = [
  { n: 'exchange', c: '#a89b85' }, { n: 'gift', p: 'exchange' }, { n: 'reciprocity', p: 'exchange' }, { n: 'kula', p: 'exchange' }, { n: 'circulation', p: 'exchange' },
  { n: 'andes', c: '#7f9168' }, { n: 'ayni', p: 'andes' }, { n: 'minga', p: 'andes' }, { n: 'feria', p: 'andes' },
  { n: 'method', c: '#8c7aa0' }, { n: 'to-revisit', c: '#b8743c' },
];
const PROJECTS = [
  { id: 'thesis', n: 'Thesis', c: '#4a5b78' }, { id: 'ch1', n: 'Ch. 1 — Theories of exchange', p: 'thesis' }, { id: 'ch2', n: 'Ch. 2 — The Huancayo feria', p: 'thesis' },
  { id: 'sem', n: 'Seminar: Economic anthropology', c: '#a8803a' },
];
let ITEMS = [
  { id: 'malinowski', type: 'book', title: 'Argonauts of the Western Pacific', creators: ['Bronisław Malinowski'], year: 1922, tags: ['kula', 'reciprocity'], projects: ['ch1', 'sem'], pdf: true, pages: 527, publisher: 'Routledge & Kegan Paul', place: 'London', links: ['mauss'] },
  { id: 'mauss', type: 'journal_article', title: 'Essai sur le don', creators: ['Marcel Mauss'], year: 1925, tags: ['gift', 'reciprocity'], projects: ['ch1'], pdf: true, pages: 186, journal: "L'Année sociologique", links: [] },
  { id: 'alberti', type: 'book', title: 'Reciprocidad e intercambio en los Andes peruanos', creators: ['Giorgio Alberti', 'Enrique Mayer'], year: 1974, tags: ['ayni', 'reciprocity', 'andes'], projects: ['ch2'], pdf: true, pages: 360, publisher: 'IEP', place: 'Lima', links: [] },
  { id: 'mayer', type: 'book', title: 'The Articulated Peasant', creators: ['Enrique Mayer'], year: 2002, tags: ['andes', 'feria'], projects: ['ch2'], pdf: true, pages: 382, publisher: 'Westview', links: [] },
  { id: 'strathern', type: 'book', title: 'The Gender of the Gift', creators: ['Marilyn Strathern'], year: 1988, tags: ['gift', 'to-revisit'], projects: ['ch1'], pdf: false, publisher: 'University of California Press', links: [] },
  { id: 'graeber', type: 'book', title: 'Toward an Anthropological Theory of Value', creators: ['David Graeber'], year: 2001, tags: ['exchange'], projects: ['sem'], pdf: true, pages: 320, publisher: 'Palgrave', links: [] },
  { id: 'tsing', type: 'book', title: 'The Mushroom at the End of the World', creators: ['Anna Lowenhaupt Tsing'], year: 2015, tags: ['circulation'], projects: ['sem'], pdf: true, pages: 352, publisher: 'Princeton University Press', links: [] },
  { id: 'fn-feria', type: 'fieldnote', title: 'Feria de Huancayo — 14 mar 2026', creators: [], year: 2026, tags: ['feria', 'minga'], projects: ['ch2'],
    body: 'Domingo. Llegué 6:40, los puestos de papa ya armados. Doña Rosa dice que "acá nadie fía, pero todos deben". Le pregunto por la minga del jueves: va a ir porque su comadre fue a la suya en enero.\n\nOjo: el fiado circula entre puesteras igual que la ayuda en la chacra. Volver sobre esto en [[Ayni vs. the Maussian gift]]. #feria #minga' },
  { id: 'int-rosa', type: 'interview', title: 'Entrevista a Doña Rosa, comerciante', creators: [], year: 2026, tags: ['feria', 'method'], projects: ['ch2'],
    body: 'Transcripción parcial (audio 00:00–14:20).\n\nR: Mi mamá vendía acá mismo, en la misma esquina. Las caseras son de toda la vida...\n\nPendiente: completar desde el minuto 14. #method' },
  { id: 'doc-ordenanza', type: 'document', title: 'Ordenanza municipal sobre ferias, 2019', creators: ['Municipalidad Provincial de Huancayo'], year: 2019, tags: ['feria'], projects: ['ch2'], pdf: true, pages: 12, links: [] },
  { id: 'n-kula', type: 'note', title: 'Kula as circulation, not exchange', creators: [], year: 2026, tags: ['kula', 'circulation'], projects: ['ch1'],

    <section><span class="label">Links · ${out.length}</span>${out.map(l => linkRow(l.it, l.t)).join('') || '<p class="muted">Write [[Title]] to link a note or a source.</p>'}</section>
    <section><span class="label">Backlinks · ${back.length}</span>${back.map(b => linkRow(b)).join('') || '<p class="muted">Nothing links here yet.</p>'}</section>
    <section><span class="label">Projects</span><div class="chips">${n.projects.map(p => `<span class="chip">${esc(proj(p).n)}</span>`).join('')}<button class="chip addchip" data-soon="Add to project">+ project</button></div></section>`;
}

// ─── Routing & events ─────────────────────────────────────────────────────
function render() {
  $('#app').dataset.view = S.view;
  $('#app').classList.remove('menu-open');
  document.querySelectorAll('.strip [data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === S.view));
  renderSide();
  ({ library: renderLibrary, reader: renderReader, note: renderNote })[S.view]();
}
function go(view) { S.view = view; closePop(); try { history.replaceState(null, '', '#' + view); } catch (e) {} render(); $('#main').scrollTop = 0; }
function open(id) {
  const i = item(id); if (!i) return;
  S.selected = id;
  if (isText(i)) { S.noteId = id; S.noteMode = i.body ? 'read' : 'edit'; go('note'); }
  else { S.readerItem = id; S.newCard = null; go('reader'); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], [data-filter], [data-newnote], tr.row, mark');
  if (!t) { closeAddMenu(); return; }
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.menu !== undefined) return $('#app').classList.toggle('menu-open');
  if (d.filter) { const [kind, id] = d.filter.split(':'); S.filter = { kind, id }; return go('library'); }
  if (d.select) { S.selected = d.select; return renderLibrary(); }
  if (d.open) return open(d.open);
  if (d.opennote) { if (S.view === 'reader' && t.tagName === 'MARK') { S.tab = 'notes'; S.newCard = null; return rerenderPanel(); } return open(d.opennote); }
  if (d.quote) { S.tab = 'quotes'; S.newCard = d.quote; return rerenderPanel(); }
  if (d.jump) {
    S.readerItem = d.jump; S.tab = 'notes'; S.newCard = null; go('reader');
    const m = d.flash && $(`mark[data-opennote="${d.flash}"]`);
    if (m) { m.scrollIntoView({ block: 'center' }); m.classList.add('flash'); setTimeout(() => m.classList.remove('flash'), 1600); }
    return;
  }
  if (d.tab) { S.tab = d.tab; return rerenderPanel(); }
  if (d.sort) { S.sort = d.sort; return renderLibrary(); }
  if (d.clearq !== undefined) { S.q = ''; return renderLibrary(); }
  if (d.mode) { saveEditor(); S.noteMode = d.mode; return renderNote(); }
  if (d.make) return makeFromSelection(d.make);
  if (d.newnote) return newNote(d.newnote);
  if (d.untag) {
    const host = S.view === 'note' ? item(S.noteId) : item(S.view === 'reader' ? S.readerItem : S.selected);
    host.tags = host.tags.filter(x => x !== d.untag); return render();
  }
  if (d.addmenu !== undefined) return toggleAddMenu(t);
  if (d.add) { closeAddMenu(); if (d.add === 'note') return newNote('Untitled note'); if (d.add === 'fieldnote') return newNote('Fieldnote — ' + new Date().toLocaleDateString('es'), 'fieldnote'); return toast(d.add + ' — coming in the real app'); }
  if (d.soon) return toast(d.soon + ' — coming in the real app');
});
function newNote(title, type = 'note') {
  const id = 'n' + Date.now();
  ITEMS.push({ id, type, title, creators: [], year: 2026, tags: [], projects: [], body: '' });
  S.noteId = id; S.noteMode = 'edit'; go('note'); setTimeout(() => $('#editor')?.focus(), 30);
}
function toggleAddMenu(btn) {
  if ($('.addmenu')) return closeAddMenu();
  const m = document.createElement('div'); m.className = 'addmenu';
  m.innerHTML = [['Upload PDF', 'Saved to Drive / Qipu', 'Upload PDF'], ['Add by DOI or ISBN', 'fills metadata', 'Add by DOI or ISBN'], ['Import BibTeX / RIS', 'with preview', 'Import BibTeX / RIS'], ['New note', '', 'note'], ['New fieldnote', '', 'fieldnote'], ['Add manually', '', 'Add manually']]
    .map(([n, s, k]) => `<button data-add="${k}">${n}<span>${s}</span></button>`).join('');
  btn.parentElement.append(m); btn.setAttribute('aria-expanded', 'true');
}
function closeAddMenu() { $('.addmenu')?.remove(); $('[data-addmenu]')?.setAttribute('aria-expanded', 'false'); }
function saveEditor() { const ed = $('#editor'); if (ed) item(S.noteId).body = ed.value; }

document.addEventListener('submit', e => { if (e.target.id === 'searchform') { e.preventDefault(); S.q = $('#q').value; renderLibrary(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.matches('tr.row')) { open(t.dataset.select); }
  if (e.key === 'Enter' && t.matches('.wikilink')) t.click();
  if (e.key === 'Enter' && t.matches('.tagin') && t.value.trim()) {
    const v = t.value.trim().replace(/^#/, '');
    if (!TAGS.some(x => x.n === v)) TAGS.push({ n: v });
    if (t.dataset.qtag) { QUOTES.find(q => q.id === t.dataset.qtag).tags.push(v); rerenderPanel(); }
    else { const it = item(t.dataset.addtag); if (!it.tags.includes(v)) it.tags.push(v); S.view === 'reader' ? rerenderPanel() : render(); renderSide(); }
  }
  if (e.key === 'Escape') { closePop(); closeAddMenu(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'editor') item(S.noteId).body = t.value;
  if (t.id === 'ntitle') { item(S.noteId).title = t.value; }
  if (t.dataset.nbody) item(t.dataset.nbody).body = t.value;
  if (t.dataset.ntitle) item(t.dataset.ntitle).title = t.value;
});
document.addEventListener('mouseup', e => {
  if (S.view !== 'reader' || e.target.closest?.('#pop')) return;
  setTimeout(() => {
    const sel = getSelection();
    if (!sel.rangeCount || sel.isCollapsed) { closePop(); return; }
    const range = sel.getRangeAt(0);
    const page = $('#page');
    if (!page || !page.contains(range.commonAncestorContainer) || range.toString().trim().length < 3) { closePop(); return; }
    pendingRange = range.cloneRange(); showPop(range);
  }, 0);
});
document.addEventListener('touchend', e => e.target.dispatchEvent(new MouseEvent('mouseup', { bubbles: true })));
$('#main').addEventListener('scroll', closePop, true);

const start = (location.hash || '').slice(1);
S.view = ['library', 'reader', 'note'].includes(start) ? start : 'library';
render();
</script>
