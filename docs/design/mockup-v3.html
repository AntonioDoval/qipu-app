<title>Qipu Workspace Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: universal navigator (left) · active view (center) · collapsible context panel (right). Spec: docs/ui-spec.md */
:root {
  /* Qipu tokens (src/lib/tokens.ts) */
  --paper: #faf8f4; --cream: #f0ebdd; --sand: #e8e2d5; --dust: #d8cfba;
  --stone: #a89b85; --sage: #7a7060; --ink: #1a1a1a;
  --accent: #4a5b78; --accent2: #6b7d99; --soft: #e6ebf3; --softer: #eef2f8;
  --surface: #ffffff; --shadow: rgba(60, 50, 30, .10); --danger: #a4462f;
  /* kind colors */
  --k-bib: #4a5b78; --k-src: #7a6a3e; --k-note: #8a5a7a;
  /* PDF pages keep paper colors in both themes, like a real document */
  --pdf-bg: #ffffff; --pdf-ink: #1c1b19; --pdf-muted: #8a8478; --pdf-bar: #ebe7de;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Lora', Georgia, 'Times New Roman', serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #191816; --cream: #211f1b; --sand: #2a2823; --dust: #3a372f;
  --stone: #8e8371; --sage: #b2a78f; --ink: #ece6da;
  --accent: #9fb1d0; --accent2: #8194b4; --soft: #263044; --softer: #1f2533;
  --surface: #23211d; --shadow: rgba(0,0,0,.4); --danger: #e08a72;
  --k-bib: #9fb1d0; --k-src: #cdb27a; --k-note: #c99bbb;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #191816; --cream: #211f1b; --sand: #2a2823; --dust: #3a372f;
  --stone: #8e8371; --sage: #b2a78f; --ink: #ece6da;
  --accent: #9fb1d0; --accent2: #8194b4; --soft: #263044; --softer: #1f2533;
  --surface: #23211d; --shadow: rgba(0,0,0,.4); --danger: #e08a72;
  --k-bib: #9fb1d0; --k-src: #cdb27a; --k-note: #c99bbb;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { opacity: .4; cursor: not-allowed; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.mono { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--sage); }
.muted { color: var(--sage); font-size: 12.5px; }
.grey { color: var(--stone); }

/* mockup strip */
.strip { display: flex; align-items: center; gap: 12px; height: 38px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--dust); background: var(--cream); white-space: nowrap; overflow-x: auto; }
.strip nav { display: flex; gap: 2px; }
.strip nav button { padding: 2px 10px; border-radius: 999px; font-size: 12.5px; color: var(--sage); }
.strip nav button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.strip .right { margin-left: auto; display: flex; gap: 6px; }
.kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--dust); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--sage); background: var(--surface); }

/* app grid */
.appbar { display: flex; align-items: center; gap: 6px; height: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--dust); background: var(--cream); }
.appbar .logo { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.02em; padding: 0 6px; }
.appbar .mockpill { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--stone); border: 1px solid var(--dust); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.appbar .spacer { flex: 1; }
.appbar .tg { width: 32px; height: 32px; }
.tabs { display: flex; gap: 2px; margin-left: 24px; min-width: 0; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 7px; font-size: 13.5px; color: var(--sage); white-space: nowrap; }
.tab:hover { background: var(--sand); color: var(--ink); }
.tab[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
.tab .ts { color: var(--stone); font-size: 12.5px; }
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: calc(100% - 48px); }
.prow { display: flex; align-items: center; gap: 1px; padding-right: 2px; }
.prow .row-nav { flex: 1; min-width: 0; }
.ptog { width: 18px; height: 22px; display: grid; place-items: center; color: var(--stone); flex: none; border-radius: 4px; }
.ptog:hover { background: var(--sand); color: var(--ink); }
.ptog svg.i { width: 11px; height: 11px; transition: transform .12s; }
.ptog[aria-expanded="true"] svg.i { transform: rotate(90deg); }
.prow .sub { opacity: 0; width: 20px; height: 20px; }
.prow:hover .sub, .prow:focus-within .sub { opacity: 1; }
.sec-h .tw .n { font-family: var(--mono); font-size: 10px; color: var(--stone); margin-left: 4px; text-transform: none; }
.lsearch { flex: 1 1 260px; min-width: 0; }
.kseg { flex: none; }
.kseg button { flex: none; padding: 4px 10px; }
.chipsrow { min-height: 0; padding-block: 6px; }
.alsonotes { display: block; padding: 14px 20px; text-align: left; }
.app.side-off { grid-template-columns: minmax(0, 1fr); }
.app.side-off .side { display: none; }
.app:not(.side-off) .show-side { display: none; }
main { min-width: 0; min-height: 0; height: 100%; }

/* sidebar */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--dust); background: var(--cream); }
.side-head { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.brand b { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.brand .iconbtn { margin-left: auto; }
.sbox { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--dust); border-radius: 7px; padding: 4px 6px 4px 9px; }
.sbox:focus-within { border-color: var(--accent2); }
.sbox input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; font-size: 13.5px; }
.sbox .kbd { flex: none; }
.iconbtn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--sage); flex: none; }
.iconbtn:hover { background: var(--sand); color: var(--ink); }
.iconbtn[aria-pressed="true"] { background: var(--soft); color: var(--accent); }
.scope { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 7px; background: var(--soft); color: var(--accent); font-size: 12.5px; }
.scope span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-body { flex: 1; overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: center; gap: 2px; padding: 2px 2px 2px 4px; border-radius: 5px; }
.sec-h .tw { display: flex; align-items: center; gap: 4px; flex: 1; text-align: left; padding: 3px 0; }
.sec-h .tw svg { width: 12px; height: 12px; transition: transform .12s; }
.sec-h[aria-expanded="true"] .tw svg { transform: rotate(90deg); }
.sec-h .iconbtn { width: 22px; height: 22px; }
.row-nav { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; padding: 3px 6px; border-radius: 5px; font-size: 13px; min-width: 0; position: relative; }
.row-nav:hover { background: var(--sand); }
.row-nav[aria-current="true"] { background: var(--soft); color: var(--accent); }
.row-nav .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-nav .n { font-family: var(--mono); font-size: 10.5px; color: var(--stone); }
.row-nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.row-nav .sub { opacity: 0; }
.row-nav:hover .sub, .row-nav:focus-within .sub { opacity: 1; }
.lvl1 { padding-left: 22px; } .lvl2 { padding-left: 38px; } .lvl3 { padding-left: 54px; }
.kindrow { display: flex; align-items: center; }
.kindrow .row-nav { flex: 1; }
.kindrow .tog { width: 20px; height: 22px; display: grid; place-items: center; color: var(--stone); }
.kindrow .tog svg { width: 11px; height: 11px; transition: transform .12s; }
.kindrow .tog[aria-expanded="true"] svg { transform: rotate(90deg); }
.itemrow { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; padding: 2px 6px 2px 28px; border-radius: 5px; font-size: 12.5px; color: var(--ink); }
.itemrow:hover { background: var(--sand); }
.itemrow[aria-current="true"] { background: var(--soft); color: var(--accent); }
.itemrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.itemrow svg.i { width: 13px; height: 13px; }
.morelink { padding: 2px 6px 2px 28px; font-size: 12px; color: var(--accent); text-align: left; }
.morelink:hover { text-decoration: underline; }
.newrow { display: flex; gap: 6px; padding: 2px 6px 4px; }
.newrow input { flex: 1; min-width: 0; border: 1px solid var(--accent2); border-radius: 5px; padding: 2px 7px; font-size: 13px; background: var(--surface); outline: 0; }
.side-foot { border-top: 1px solid var(--dust); padding: 8px; display: flex; gap: 2px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.side-foot .row-nav { flex: 1; }
.results .grp { margin-top: 6px; }
.results .itemrow { padding-left: 8px; }
.results .hint { padding: 6px 8px; font-size: 12px; color: var(--sage); }

/* kind icon */
.k { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.k.bib { color: var(--k-bib); } .k.source { color: var(--k-src); } .k.note { color: var(--k-note); }
.k small { font-family: var(--mono); font-size: 10px; color: var(--sage); letter-spacing: .02em; }

/* view shell */
.view { display: grid; grid-template-columns: minmax(0, 1fr) 330px; height: 100%; min-height: 0; }
.view.panel-off { grid-template-columns: minmax(0, 1fr); }
.view.panel-off > .panel { display: none; }
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--dust); min-height: 56px; }
.top h1 { font-family: var(--display); font-size: 21px; font-weight: 500; letter-spacing: -.01em; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sub { color: var(--sage); font-size: 13px; }
.top .spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--dust); background: var(--surface); font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--stone); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn.quiet { border-color: transparent; background: none; color: var(--sage); }
.btn.quiet:hover { background: var(--sand); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 2px 8px; font-size: 12px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: var(--sand); font-size: 12px; white-space: nowrap; color: var(--ink); max-width: 100%; }
button.chip:hover { background: var(--dust); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip.proj { background: var(--soft); color: var(--accent); }
.chip.filter { background: var(--soft); color: var(--accent); }
.chip .x { color: var(--stone); font-size: 13px; line-height: 1; }
.tagin { width: 76px; border: 1px dashed var(--dust); border-radius: 999px; padding: 0 8px; background: none; font-size: 12px; outline: 0; }
.tagin:focus { border-style: solid; border-color: var(--accent2); }

/* library */
.lib-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 20px; border-bottom: 1px solid var(--sand); min-height: 44px; }
.selbar { background: var(--soft); }
.selbar b { color: var(--accent); font-weight: 500; }
.tablewrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: var(--paper); text-align: left; font-weight: 400; padding: 7px 8px; border-bottom: 1px solid var(--dust); z-index: 1; white-space: nowrap; }
th button { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--sage); display: inline-flex; gap: 3px; }
th button[data-on="true"] { color: var(--ink); }
td { padding: 8px; border-bottom: 1px solid var(--sand); vertical-align: top; }
th:first-child, td:first-child { padding-left: 20px; width: 34px; }
tr.r { cursor: default; }
tr.r:hover td { background: var(--softer); }
tr.r[aria-selected="true"] td { background: var(--soft); }
tr.r.checked td { background: color-mix(in srgb, var(--soft) 70%, var(--paper)); }
.ttl { font-weight: 500; line-height: 1.35; text-align: left; }
.ttl:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.snip { font-size: 12.5px; color: var(--sage); margin-top: 3px; }
.snip em { font-style: normal; background: color-mix(in srgb, #f5d547 45%, transparent); color: var(--ink); }
.au { font-size: 13px; color: var(--ink); white-space: nowrap; display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
td.tcol { min-width: 230px; }
.yr, .dt { font-family: var(--mono); font-size: 11.5px; color: var(--sage); white-space: nowrap; font-variant-numeric: tabular-nums; }
.has { display: flex; gap: 8px; color: var(--stone); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.has span { display: inline-flex; gap: 3px; align-items: center; }
.has svg.i { width: 12px; height: 12px; }
input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; margin: 2px 0 0; }
.empty { padding: 48px 24px; color: var(--sage); font-style: italic; text-align: center; }

/* panel */
.panel { border-left: 1px solid var(--dust); background: var(--paper); overflow-y: auto; min-width: 0; display: flex; flex-direction: column; }
.pbody { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { font-family: var(--display); font-size: 19px; font-weight: 500; line-height: 1.25; margin: 2px 0; text-wrap: balance; }
.panel section { display: flex; flex-direction: column; gap: 6px; }
.meta { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 0; }
.meta dt { color: var(--sage); font-family: var(--mono); font-size: 10.5px; padding-top: 2px; }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.linkrow { display: flex; gap: 8px; align-items: center; padding: 3px 0; text-align: left; width: 100%; font-size: 13px; }
.linkrow .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkrow:hover .t { color: var(--accent); text-decoration: underline; }
.ptabs { display: flex; border-bottom: 1px solid var(--dust); padding: 0 10px; position: sticky; top: 0; background: var(--paper); z-index: 2; }
.ptabs button { padding: 11px 9px 9px; font-size: 13px; color: var(--sage); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.ptabs .n { font-family: var(--mono); font-size: 10.5px; color: var(--stone); margin-left: 3px; }

/* annotation cards */
.colorfilter { display: flex; gap: 4px; flex-wrap: wrap; }
.cf { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--dust); font-size: 12px; }
.cf[aria-pressed="true"] { border-color: var(--ink); }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.acard { border: 1px solid var(--dust); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; background: var(--surface); border-left: 4px solid var(--ac); }
.acard.flash { box-shadow: 0 0 0 2px var(--accent2); }
.acard .head { display: flex; align-items: center; gap: 8px; }
.acard .head .label { color: var(--sage); }
.acard .txt { font-size: 13.5px; line-height: 1.5; cursor: pointer; }
.acard .txt:hover { color: var(--accent); }
.loc { width: 74px; border: 1px solid transparent; border-radius: 4px; padding: 0 5px; background: var(--softer); font-family: var(--mono); font-size: 11px; }
.loc:hover, .loc:focus { border-color: var(--dust); outline: 0; }
.notelink { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--k-note); text-align: left; }
.notelink:hover { text-decoration: underline; }
.multibar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 10px 18px; background: var(--soft); border-top: 1px solid var(--dust); margin-top: auto; }

/* reader */
.tools { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 6px 16px; border-bottom: 1px solid var(--dust); background: var(--paper); }
.tools .sep { width: 1px; height: 20px; background: var(--dust); margin: 0 6px; }
.tool { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--sage); }
.tool:hover:not(:disabled) { background: var(--sand); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.swatch { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 7px; border-radius: 6px; font-family: var(--mono); font-size: 11px; color: var(--sage); }
.swatch i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.swatch[aria-pressed="true"] { background: var(--sand); color: var(--ink); box-shadow: inset 0 0 0 1px var(--stone); }
.swatch:not([aria-pressed="true"]) .nm { display: none; }
.swatch .nm { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--body); font-size: 12px; }
.pagewrap { flex: 1; overflow: auto; background: var(--sand); padding: 26px 18px 70px; }
.page { position: relative; max-width: 660px; margin: 0 auto; background: var(--pdf-bg); color: var(--pdf-ink); box-shadow: 0 1px 3px var(--shadow), 0 10px 28px var(--shadow); padding: 56px 66px 60px; font-family: 'Times New Roman', Georgia, serif; font-size: 15.5px; line-height: 1.62; }
.page.text { font-family: var(--body); font-size: 15px; line-height: 1.75; max-width: 700px; }
.page.drawing { user-select: none; -webkit-user-select: none; }
.page .runhead { display: flex; justify-content: space-between; font-size: 12px; color: var(--pdf-muted); letter-spacing: .06em; margin-bottom: 34px; font-variant: small-caps; }
.page h3 { text-align: center; font-weight: 400; font-size: 14px; letter-spacing: .18em; margin: 0 0 4px; }
.page h4 { text-align: center; font-weight: 400; font-size: 17px; letter-spacing: .08em; margin: 0 0 28px; }
.page p { margin: 0 0 14px; text-indent: 1.6em; text-align: justify; hyphens: auto; }
.page.text p { text-indent: 0; text-align: left; }
.page .bar { height: 10px; background: var(--pdf-bar); border-radius: 2px; margin: 0 0 11px; }
.page .foot { text-align: center; color: var(--pdf-muted); font-size: 12px; margin-top: 26px; text-indent: 0; }
.page .srcmeta { font-family: var(--mono); font-size: 11px; color: var(--pdf-muted); margin-bottom: 22px; display: flex; gap: 14px; flex-wrap: wrap; }
mark.hl { color: inherit; background: color-mix(in srgb, var(--hc) 42%, transparent); border-radius: 2px; cursor: pointer; padding: 1px 0; }
mark.hl.noted { text-decoration: underline dotted var(--hc); text-decoration-thickness: 2px; text-underline-offset: 3px; }
mark.hl.flash, mark.hl.sel { outline: 2px solid var(--accent); }
svg.ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.ink .shape { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: visibleStroke; cursor: pointer; }
svg.ink .shape.flash { stroke-width: 4.5; }
.page.drawing svg.ink { pointer-events: all; cursor: crosshair; }
.page.erasing svg.ink .shape { cursor: not-allowed; }

// ── Citations ──
const ini = g => g.split(/[\s]+/).filter(Boolean).map(p => p[0] + '.').join(' ');
function apaNames(c) { const n = c.map(x => `${x.f}, ${ini(x.g)}`); return n.length === 1 ? n[0] : n.length === 2 ? `${n[0]}, & ${n[1]}` : n.slice(0, -1).join(', ') + ', & ' + n[n.length - 1]; }
function chiNames(c) { const n = c.map((x, k) => k ? `${x.g} ${x.f}` : `${x.f}, ${x.g}`); return n.length === 1 ? n[0] : n.length === 2 ? `${n[0]}, and ${n[1]}` : n.slice(0, -1).join(', ') + ', and ' + n[n.length - 1]; }
function mlaNames(c) { return c.length === 1 ? `${c[0].f}, ${c[0].g}` : c.length === 2 ? `${c[0].f}, ${c[0].g}, and ${c[1].g} ${c[1].f}` : `${c[0].f}, ${c[0].g}, et al`; }
function cite(i, style) {
  const art = i.type === 'article', T = esc(i.title), J = esc(i.journal || ''), P = esc(i.publisher || ''), L = esc(i.place || '');
  if (style === 'apa7') return art ? `${apaNames(i.creators)} (${i.year}). ${T}. <i>${J}</i>, <i>${i.volume}</i>, ${i.pp}.` : `${apaNames(i.creators)} (${i.year}). <i>${T}</i>. ${P}.`;
  if (style === 'apa6') return art ? `${apaNames(i.creators)} (${i.year}). ${T}. <i>${J}, ${i.volume}</i>, ${i.pp}.` : `${apaNames(i.creators)} (${i.year}). <i>${T}</i>. ${L}: ${P}.`;
  if (style === 'chicago') return art ? `${chiNames(i.creators)}. ${i.year}. “${T}.” <i>${J}</i> ${i.volume}: ${i.pp}.` : `${chiNames(i.creators)}. ${i.year}. <i>${T}</i>. ${L}: ${P}.`;
  return art ? `${mlaNames(i.creators)}. “${T}.” <i>${J}</i>, vol. ${i.volume}, ${i.year}, pp. ${i.pp}.` : `${mlaNames(i.creators)}. <i>${T}</i>. ${P}, ${i.year}.`;
}
let CITESTYLE = 'apa7';
function citeModal() {
  const its = [...S.checked].map(item).filter(i => i.kind === 'bib').sort((a, b) => fold(a.creators[0]?.f || a.title).localeCompare(fold(b.creators[0]?.f || b.title)));
  const s = modal(`<div class="mh"><h2>Copy citations</h2><span style="flex:1"></span><button class="iconbtn" data-act="closemodal" aria-label="Close">${ic('x')}</button></div>
    <div class="mb"><div class="seg">${[['apa7', 'APA 7'], ['apa6', 'APA 6'], ['chicago', 'Chicago'], ['mla', 'MLA'], ['custom', 'Custom…']].map(([k, n]) => `<button data-cstyle="${k}" aria-pressed="${CITESTYLE === k}">${n}</button>`).join('')}</div>
      <div class="cites" id="cites">${its.map(i => `<p>${cite(i, CITESTYLE)}</p>`).join('')}</div>
      <span class="muted">${its.length} reference${its.length > 1 ? 's' : ''}, sorted alphabetically. Italics are kept when you paste into Word or Google Docs.</span></div>

async function copyRich(el) {
  const html = el.innerHTML, plain = el.innerText;
  try { await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]); toast('Copied with formatting'); }

}

  modal(`<div class="mh"><h2>Add by DOI, ISBN or link</h2><span style="flex:1"></span><button class="iconbtn" data-act="closemodal" aria-label="Close">${ic('x')}</button></div>
    <div class="mb"><label class="field"><span>DOI, ISBN or URL</span><input id="doiin" value="9780520076037" placeholder="10.1086/… · 978… · https://…"></label>
    <div class="detected">Found: <b>Weiner, Annette B. 1992. <i>Inalienable Possessions</i>. University of California Press.</b></div><span class="muted">Example lookup. You can attach a PDF later from the reference's page.</span></div>
    <div class="mf"><button class="btn primary" data-act="doi-add">Add to library</button></div>`);
  $('#doiin').focus();
}

// ═══ Events ═══════════════════════════════════════════════════════════════
document.addEventListener('click', e => {
  if (AC && !e.target.closest('.ac')) closeAC();
  const t = e.target.closest('button, [data-act], [data-open], [data-tag], [data-scope], [data-newnote], [data-goto], [data-jump], mark.hl, tr.r, [data-untag], [data-anncheck], [data-check]');
  if (!t) { if (!e.target.closest('.pop')) closeLayer(); return; }
  const d = t.dataset;
  if (t.matches('input[type="checkbox"]')) {
    if (d.check) { S.checked.has(d.check) ? S.checked.delete(d.check) : S.checked.add(d.check); return renderLibrary(); }
    if (d.anncheck) { S.annChecked.has(d.anncheck) ? S.annChecked.delete(d.anncheck) : S.annChecked.add(d.anncheck); return rerenderPanel(); }
    if (d.act === 'checkall') return act('checkall');
    if (d.fhas) { const h = d.fhas; S.filters.has = t.checked ? [...S.filters.has, h] : S.filters.has.filter(x => x !== h); S.trash = false; return refreshAfterFilter(); }
    if (d.col) { S.cols[d.col] = t.checked ? 1 : 0; return renderLibrary(); }
    return;
  }
  if (!t.closest('.pop') && !d.act?.startsWith?.('bulk-') ) closeLayer();
  if (d.untag) { e.stopPropagation(); const i = item(d.from); i.tags = i.tags.filter(x => x !== d.untag); return S.view === 'reader' ? rerenderPanel() : render(); }
  if (d.go) { if (d.go === 'library') return toLibrary(); if (d.go === 'reader') return S.reader && item(S.reader) ? openItem(S.reader) : go('reader'); if (S.view === 'note' && S.note) { S.note = null; return go('note'); } return S.note && item(S.note) ? openItem(S.note) : go('note'); }
  if (d.act === 'doi-add') { const id = 'weiner'; if (!item(id)) ITEMS.push({ id, kind: 'bib', type: 'book', title: 'Inalienable Possessions: The Paradox of Keeping-While-Giving', creators: [A('Weiner', 'Annette B.')], year: 1992, publisher: 'University of California Press', place: 'Berkeley', pdf: false, tags: [], projects: S.filters.project ? [S.filters.project] : [], links: [], created: Date.now(), modified: Date.now(), opened: Date.now() }); closeModal(); toast('Added to Bibliography'); S.selected = id; return toLibrary(); }
  if (d.act) return act(d.act, t, e);
  if (d.open) return openItem(d.open, e.metaKey || e.ctrlKey);
  if (d.kind !== undefined && t.matches('.row-nav, .morelink')) { S.filters.kind = d.kind || null; S.filters.tag = null; return toLibrary(); }
  if (d.tag) { closeModal(); return filterTag(d.tag); }
  if (d.scope) return setScope(d.scope);
  if (d.newnote) { const n = createNoteAndOpen({ title: d.newnote }); return; }
  if (d.sort) { S.sort = S.sort.key === d.sort ? { key: d.sort, dir: -S.sort.dir } : { key: d.sort, dir: ['created', 'modified', 'year'].includes(d.sort) ? -1 : 1 }; return renderLibrary(); }
  if (t.matches('tr.r')) { S.selected = d.select; $$('tr.r').forEach(r => r.setAttribute('aria-selected', r.dataset.select === d.select)); const pb = $('#main .panel .pbody'); if (pb) pb.innerHTML = infoHTML(item(d.select), 'library'); return; }
  // reader
  if (d.tool) { S.tool = d.tool; return rerenderToolsAndPage(); }
  if (d.color !== undefined) { S.color = +d.color; if (!highlightSelection(S.color)) { $$('.swatch').forEach(s => s.setAttribute('aria-pressed', +s.dataset.color === S.color)); } return; }
  if (d.hlc !== undefined) return highlightSelection(+d.hlc, true);
  if (d.recolor !== undefined) { snapshot(); ANNS.find(a => a.id === d.ann).color = +d.recolor; closeLayer(); rerenderPage(); rerenderPanel(); return; }
  if (t.matches('mark.hl')) {
    if (!getSelection().isCollapsed) return;
    if (S.tool === 'eraser') { snapshot(); ANNS = ANNS.filter(a => a.id !== d.ann); rerenderPage(); rerenderPanel(); return; }
    $$('mark.hl.sel').forEach(m => m.classList.remove('sel')); $$(`mark[data-ann="${d.ann}"]`).forEach(m => m.classList.add('sel'));
    S.rtab = 'annotations'; if (!S.panelNote) rerenderPanel(); flashAnn(d.ann, false);
    return showAnnPop(d.ann, t);
  }
  if (d.rtab) { S.rtab = d.rtab; S.panelNote = null; rerenderPanel(); if (d.rtab === 'search') $('#rsq')?.focus(); return; }
  if (d.cf !== undefined) { S.colorFilter = d.cf === '' ? null : +d.cf; rerenderPanel(); return rerenderPage(); }
  if (d.goto) return flashAnn(d.goto);
  if (d.hit !== undefined) { const h = searchHits(item(S.reader), S.rsearch)[+d.hit]; return selectOffsets(h.p, h.s, h.e); }
  if (d.pnote) { S.panelNote = d.pnote; return rerenderPanel(); }
  if (d.jump) { const id = d.jump, fl = d.flash; S.reader = id; S.panelNote = null; S.rtab = 'annotations'; item(id).opened = Date.now(); go('reader'); if (fl) setTimeout(() => flashAnn(fl), 60); return; }
  // notes
  if (d.mode) { S.noteMode = d.mode; renderNote(); if (d.mode === 'edit') $('#editor')?.focus(); return; }
  // menus & dialogs
  if (d.lkind !== undefined) { S.filters.kind = d.lkind || null; return renderLibrary(); }
  if (d.fkind !== undefined) { S.filters.kind = d.fkind || null; $$('[data-fkind]').forEach(b => b.setAttribute('aria-pressed', b.dataset.fkind === d.fkind)); return refreshAfterFilter(); }
  if (d.kp !== undefined) { const x = KP.list[+d.kp]; closeModal(); return x.run(); }
  if (d.upcur !== undefined) { UP.cur = +d.upcur; return drawUpload(); }
  if (d.upkind) { const x = UP.files[UP.cur]; x.kind = d.upkind; if (d.upkind === 'bib' && !BIB_TYPES[x.f.type]) x.f.type = 'book'; if (d.upkind === 'source' && BIB_TYPES[x.f.type]) x.f.type = ''; return drawUpload(); }
  if (d.upproj) { const x = UP.files[UP.cur]; x.projects = x.projects.includes(d.upproj) ? x.projects.filter(p => p !== d.upproj) : [...x.projects, d.upproj]; return drawUpload(); }
  if (d.uptagdel) { const x = UP.files[UP.cur]; x.tags = x.tags.filter(z => z !== d.uptagdel); return drawUpload(); }
  if (d.cstyle) { if (d.cstyle === 'custom') return soon('Custom citation styles (CSL)'); CITESTYLE = d.cstyle; return citeModal(); }
  if (d.ack !== undefined) return pickAC(+d.ack);
});
function refreshAfterFilter() { renderSide(); if (S.view === 'library') renderLibrary(); else toLibrary(); }
function rerenderToolsAndPage() { renderReader(); }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fproj') { S.filters.project = t.value || null; return refreshAfterFilter(); }
  if (t.id === 'ftag') { S.filters.tag = t.value || null; return refreshAfterFilter(); }
  if (t.dataset.uf === 'type') {
    const x = UP.files[UP.cur];
    if (t.value === '__new') {
      const s = $('#upform'); const row = document.createElement('div'); row.className = 'newrow'; row.style.padding = 0;
      row.innerHTML = `<input id="newtype" placeholder="New source type, e.g. Price list" aria-label="New source type"><button class="btn sm primary" data-act="noop" id="newtypebtn">Add type</button>`;
      t.closest('.field').after(row); $('#newtype').focus(); t.value = x.f.type; return;
    }
    x.f.type = t.value; return drawUpload();
  }
  if (t.dataset.pc !== undefined) { PALETTE[+t.dataset.pc].c = t.value; rerenderPage(); rerenderPanel(); $$('.swatch i')[+t.dataset.pc].style.background = t.value; }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'sq') { S.sq = t.value; renderSide(); return; }
  if (t.id === 'lq' || t.id === 'nq') { const pos = t.selectionStart; if (t.id === 'lq') { S.lq = t.value; S.fulltext = ''; renderLibrary(); } else { S.nq = t.value; renderNotesList(); } const n = $('#' + t.id); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'rsq') { S.rsearch = t.value; const pos = t.selectionStart; rerenderPanel(); const n = $('#rsq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'kq') { KP.k = 0; return drawFinder(t.value); }
  if (d.uf) { const x = UP.files[UP.cur]; x.f[d.uf] = t.value; const [cls, txt] = fileStatus(x); const btn = $(`[data-upcur="${UP.cur}"] .status`); if (btn) { btn.className = 'status ' + cls; btn.textContent = txt; } const sv = $('[data-act="upsave"]'); if (sv) sv.disabled = cls !== 'ok'; return; }
  if (d.pn !== undefined) { PALETTE[+d.pn].n = t.value; $$('.swatch .nm')[+d.pn].textContent = t.value; return; }
  if (d.pc !== undefined) { PALETTE[+d.pc].c = t.value; $$('.swatch i')[+d.pc].style.background = t.value; $$(`mark.hl`).forEach(m => { const a = ANNS.find(x => x.id === m.dataset.ann); if (a && a.color === +d.pc) m.style.setProperty('--hc', t.value); }); return; }
  if (d.ntitle || d.nbody) {
    const n = item(d.ntitle || d.nbody);
    if (d.ntitle) n.title = t.value; else n.body = t.value;
    n.modified = Date.now();
    $$(`[data-saved="${n.id}"]`).forEach(s => s.textContent = 'Saving…');
    clearTimeout(window._sv); window._sv = setTimeout(() => { $$(`[data-saved="${n.id}"]`).forEach(s => s.textContent = 'Saved just now'); const np = $('#npanel .pbody'); if (np) np.innerHTML = noteSide(n); renderSide(); renderTabs(); }, 600);
    if (d.nbody) updateAC(t);
  }
  if (d.loc) { const a = ANNS.find(x => x.id === d.loc); a.loc = t.value; }
});
document.addEventListener('keydown', e => {
  const t = e.target, mod = e.metaKey || e.ctrlKey;
  const typing = t.matches('input, textarea, select, [contenteditable]');
  // autocomplete navigation
  if (AC && ['ArrowDown', 'ArrowUp', 'Enter', 'Tab', 'Escape'].includes(e.key)) {
    e.preventDefault();
    if (e.key === 'Escape') return closeAC();
    if (e.key === 'ArrowDown') AC.k = (AC.k + 1) % AC.opts.length; else if (e.key === 'ArrowUp') AC.k = (AC.k - 1 + AC.opts.length) % AC.opts.length; else return pickAC(AC.k);
    return drawAC();
  }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('.kpal') ? closeModal() : openFinder(); }
  if (mod && e.key === '\\') { e.preventDefault(); return act('toggle-side'); }
  if (mod && e.key === '.') { e.preventDefault(); return act('toggle-panel'); }
  if (t.id === 'kq') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); KP.k = (KP.k + (e.key === 'ArrowDown' ? 1 : -1) + KP.list.length) % Math.max(1, KP.list.length); return drawFinder(t.value); }
    if (e.key === 'Enter' && KP.list[KP.k]) { e.preventDefault(); const x = KP.list[KP.k]; closeModal(); return x.run(); }
  }
  if (e.key === 'Escape') { if (t.id === 'newproj') { S.newProjUnder = undefined; return renderSide(); } if ($('.scrim')) return closeModal(); if ($('.pop')) return closeLayer(); if (S.view === 'reader' && S.tool !== 'select') { S.tool = 'select'; return renderReader(); } if (t.id === 'sq') { t.value = ''; S.sq = ''; renderSide(); } return; }
  if (t.id === 'sq' && e.key === 'Enter' && SIDE_FIRST && t.value.trim()) { e.preventDefault(); const F = SIDE_FIRST; return F.open ? openItem(F.open) : F.scope ? setScope(F.scope) : filterTag(F.tag); }
  if (t.id === 'lq' && e.key === 'Enter') { e.preventDefault(); S.fulltext = t.value.trim(); S.lq = t.value; renderLibrary(); const n = $('#lq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); return; }
  if (t.id === 'newproj' && e.key === 'Enter' && t.value.trim()) { const id = 'p' + Date.now(); if (S.newProjUnder) S.popen[S.newProjUnder] = true; PROJECTS.splice(S.newProjUnder ? PROJECTS.findIndex(p => p.id === S.newProjUnder) + 1 : PROJECTS.length, 0, { id, n: t.value.trim(), p: S.newProjUnder || null, c: S.newProjUnder ? null : '#7f9168' }); S.newProjUnder = undefined; renderSide(); return toast('Project created. Hover a project and press its + to nest one inside.'); }
  if (t.id === 'newproj' && e.key === 'Escape') { S.newProjUnder = undefined; return renderSide(); }
  if (t.id === 'newtype' && e.key === 'Enter' && t.value.trim()) { e.preventDefault(); return addSourceType(t.value.trim()); }
  if (t.matches('[data-addtag], [data-anntag], [data-uptag]') && e.key === 'Enter' && t.value.trim()) {
    const v = t.value.trim().replace(/^#/, '');
    if (t.dataset.addtag) { const i = item(t.dataset.addtag); if (!i.tags.includes(v)) i.tags.push(v); S.view === 'reader' ? rerenderPanel() : render(); renderSide(); setTimeout(() => $(`[data-addtag="${i.id}"]`)?.focus(), 10); }
    else if (t.dataset.anntag) { const a = ANNS.find(x => x.id === t.dataset.anntag); if (!a.tags.includes(v)) a.tags.push(v); rerenderPanel(); renderSide(); setTimeout(() => $(`[data-anntag="${a.id}"]`)?.focus(), 10); }
    else { const x = UP.files[UP.cur]; if (!x.tags.includes(v)) x.tags.push(v); drawUpload(); setTimeout(() => $('[data-uptag]')?.focus(), 10); }
    return;
  }
  if (t.id === 'bulktag' && e.key === 'Enter') return act('bulk-tag-go');
  if (t.matches('[role="button"], .wikilink, .hashtag') && e.key === 'Enter') return t.click();
  if (typing) return;
  if (S.view === 'reader' && mod && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
  if (S.view === 'reader' && /^[1-5]$/.test(e.key) && !mod) {
    const k = +e.key - 1;
    if (highlightSelection(k)) return;
    const selMark = $('mark.hl.sel');
    if (selMark && $('.pop.dark')) { snapshot(); ANNS.find(a => a.id === selMark.dataset.ann).color = k; closeLayer(); rerenderPage(); rerenderPanel(); return; }
    S.color = k; $$('.swatch').forEach(s => s.setAttribute('aria-pressed', +s.dataset.color === k)); return toast(`Active color ${k + 1}: ${PALETTE[k].n}`);
  }
  if (t.matches('tr.r') && e.key === 'Enter') return openItem(t.dataset.select);
});
document.addEventListener('click', e => { if (e.target.id === 'newtypebtn') { const v = $('#newtype').value.trim(); if (v) addSourceType(v); } });
function addSourceType(v) { if (!SOURCE_TYPES.includes(v)) SOURCE_TYPES.push(v); UP.files[UP.cur].f.type = v; drawUpload(); toast(`Added source type “${v}”. It's now available for every source.`); }

document.addEventListener('mousedown', e => { if (e.target.closest?.('.pop.dark .dotbtn, .tools .swatch')) e.preventDefault(); });
// text selection in the reader → color popover
document.addEventListener('mouseup', e => {
  if (S.view !== 'reader' || S.tool !== 'select' || e.target.closest?.('.pop, .panel, .tools')) return;
  setTimeout(() => { const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return; const r = sel.getRangeAt(0); if ($('#page')?.contains(r.commonAncestorContainer) && r.toString().trim().length > 1) showSelPop(r); }, 0);
});

// drawing shapes and ink on PDF pages
let DRAW = null;
document.addEventListener('pointerdown', e => {
  const svg = e.target.closest?.('svg.ink');
  if (svg && S.tool === 'eraser' && e.target.dataset.ann) { snapshot(); ANNS = ANNS.filter(a => a.id !== e.target.dataset.ann); rerenderPage(); rerenderPanel(); return; }
  if (svg && S.tool === 'select' && e.target.dataset.ann) { e.preventDefault(); S.rtab = 'annotations'; if (!S.panelNote) rerenderPanel(); flashAnn(e.target.dataset.ann, false); return showAnnPop(e.target.dataset.ann, e.target); }
  if (!svg || !['rect', 'circle', 'star', 'ink'].includes(S.tool)) return;
  e.preventDefault(); svg.setPointerCapture?.(e.pointerId);
  const r = $('#page').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const el = document.createElementNS('http://www.w3.org/2000/svg', S.tool === 'rect' ? 'rect' : S.tool === 'circle' ? 'ellipse' : S.tool === 'star' ? 'polygon' : 'polyline');
  el.setAttribute('class', 'shape'); el.setAttribute('stroke', PALETTE[S.color].c); svg.append(el);
  DRAW = { x, y, el, pts: [[x, y]], r };
});
document.addEventListener('pointermove', e => {
  if (!DRAW) return;
  const x = e.clientX - DRAW.r.left, y = e.clientY - DRAW.r.top, el = DRAW.el;
  if (S.tool === 'ink') { DRAW.pts.push([Math.round(x), Math.round(y)]); el.setAttribute('points', DRAW.pts.map(p => p.join(',')).join(' ')); return; }
  const bx = Math.min(x, DRAW.x), by = Math.min(y, DRAW.y), bw = Math.abs(x - DRAW.x), bh = Math.abs(y - DRAW.y); DRAW.box = [bx, by, bw, bh].map(Math.round);
  if (S.tool === 'rect') { el.setAttribute('x', bx); el.setAttribute('y', by); el.setAttribute('width', bw); el.setAttribute('height', bh); }
  if (S.tool === 'circle') { el.setAttribute('cx', bx + bw / 2); el.setAttribute('cy', by + bh / 2); el.setAttribute('rx', bw / 2); el.setAttribute('ry', bh / 2); }
  if (S.tool === 'star') el.setAttribute('points', starPts(bx, by, bw, bh));
});
document.addEventListener('pointerup', () => {
  if (!DRAW) return;
  const D = DRAW; DRAW = null;
  const ok = S.tool === 'ink' ? D.pts.length > 3 : D.box && D.box[2] > 6 && D.box[3] > 6;
  if (!ok) { D.el.remove(); return; }
  snapshot();
  ANNS.push({ id: 'a' + Date.now(), item: S.reader, type: S.tool, color: S.color, box: D.box, pts: S.tool === 'ink' ? D.pts : undefined, tags: [], created: Date.now() });
  rerenderPage(); rerenderPanel();
});

// drag & drop: files onto the window → upload dialog; sidebar items into a note → [[link]]
document.addEventListener('dragstart', e => { const t = e.target.closest?.('[data-drag]'); if (t) { e.dataTransfer.setData('text/plain', `[[${t.dataset.drag}]]`); e.dataTransfer.effectAllowed = 'copy'; } });
let veil = null;
document.addEventListener('dragover', e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  if (!veil) { veil = document.createElement('div'); veil.className = 'dropveil'; veil.textContent = 'Drop to add to your library'; document.body.append(veil); }
  clearTimeout(window._vt); window._vt = setTimeout(() => { veil?.remove(); veil = null; }, 150);
});
document.addEventListener('drop', e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); veil?.remove(); veil = null;
  const files = [...e.dataTransfer.files].map(f => ({ name: f.name, detect: null }));
  if (S.view === 'reader' && e.target.closest?.('#attachzone')) { const i = item(S.reader); i.pdf = true; i.pages = 24; toast('PDF attached'); return renderReader(); }
  if (files.length) { closeModal(); openUpload(files); }
});
$('#filepick').addEventListener('change', e => { const files = [...e.target.files].map(f => ({ name: f.name, detect: null })); e.target.value = ''; if (files.length) { closeModal(); openUpload(files); } });
const _openUpload = openUpload;
openUpload = files => { if (!files.length) return drawUploadEmpty(); _openUpload(files); };

document.addEventListener('dblclick', e => { const r = e.target.closest?.('tr.r'); if (r && !e.target.closest('input, button')) openItem(r.dataset.select); });
$('#main').addEventListener('scroll', () => { if (!$('.pop.dark')) return; closeLayer(); }, true);
setInterval(() => $$('[data-saved]').forEach(s => { const n = item(s.dataset.saved); if (n && s.textContent !== 'Saving…') s.textContent = 'Saved ' + ago(n.modified); }), 30000);
window.addEventListener('resize', () => { if (innerWidth > 860 && S.sideMobile) { S.sideMobile = false; $('#app').classList.remove('side-mobile'); } });

const start = (location.hash || '').slice(1);
if (start === 'reader') openItem('malinowski'); else if (start === 'note') openItem('n-kula'); else render();
window.addEventListener('resize', renderTabs);
</script>
